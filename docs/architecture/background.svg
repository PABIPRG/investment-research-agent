<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img" aria-label="后台研究与联系流程">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#587895"/></marker></defs>
<rect width="1100" height="700" fill="#f7f9fb"/>
<text x="65" y="58" font-size="30" font-weight="700" fill="#18364a">后台研究与联系流程</text>
<text x="65" y="94" font-size="16" fill="#526b7c">图示职责已落在领域代码 · 真模型、在线事件与外发未在本轮验收</text>
<path d="M505 200 H587" fill="none" stroke="#587895" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M815 255 V285 H285 V307" fill="none" stroke="#587895" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M505 370 H587" fill="none" stroke="#587895" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M815 425 V455 H285 V477" fill="none" stroke="#587895" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M505 540 H587" fill="none" stroke="#587895" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="65" y="145" width="440" height="110" rx="10" fill="white" stroke="#b6c8d6"/>
<text x="85" y="180" font-size="20" font-weight="600" fill="#18364a">1. 创建委托 / 资料版本事件</text>
<text x="85" y="218" font-size="15" fill="#526b7c">持久 outbox / inbox → 依赖匹配</text>
<rect x="595" y="145" width="440" height="110" rx="10" fill="white" stroke="#b6c8d6"/>
<text x="615" y="180" font-size="20" font-weight="600" fill="#18364a">2. 业务 job → execution / attempt</text>
<text x="615" y="218" font-size="15" fill="#526b7c">版本、取消代次与 lease 绑定</text>
<rect x="65" y="315" width="440" height="110" rx="10" fill="white" stroke="#b6c8d6"/>
<text x="85" y="350" font-size="20" font-weight="600" fill="#18364a">3. 有界 DSH 研究 → 证据准入</text>
<text x="85" y="388" font-size="15" fill="#526b7c">主体、期间、指标、来源、本次尝试</text>
<rect x="595" y="315" width="440" height="110" rx="10" fill="white" stroke="#b6c8d6"/>
<text x="615" y="350" font-size="20" font-weight="600" fill="#18364a">4. 基准 / 复核 → 四值条件</text>
<text x="615" y="388" font-size="15" fill="#526b7c">met / unmet / unknown / error</text>
<rect x="65" y="485" width="440" height="110" rx="10" fill="white" stroke="#b6c8d6"/>
<text x="85" y="520" font-size="20" font-weight="600" fill="#18364a">5. 核心决定 → 通知队列</text>
<text x="85" y="558" font-size="15" fill="#526b7c">渠道、静默、TTL 与失败分类</text>
<rect x="595" y="485" width="440" height="110" rx="10" fill="white" stroke="#b6c8d6"/>
<text x="615" y="520" font-size="20" font-weight="600" fill="#18364a">6. 发送前复核 → 投递回执</text>
<text x="615" y="558" font-size="15" fill="#526b7c">授权与代次事务核对；unknown 对账</text>
<text x="65" y="665" font-size="14" fill="#526b7c">火火 · 2026-10-26 接力候选 | 受控验证与真实研究、发布分开记录</text>
</svg>
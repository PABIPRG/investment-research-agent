function previewFact(){
 const form=q('#fact-form');if(!form.reportValidity())return;
 const index=Number(q('#fact-stock').value),h=holdings[index],qty=Number(q('#fact-qty').value),price=Number(q('#fact-price').value),type=q('#fact-type').value,mode=q('#fact-mode').value,time=q('#fact-date').value,note=q('#fact-note').value.trim();
 if(!Number.isFinite(qty)||qty<=0||!Number.isFinite(price)||price<=0||!note||!time){q('#panel-status').textContent='请补齐数量、价格、日期与原因。';return;}
 if(mode==='同时更新持仓'&&type==='卖出'&&qty>h.qty){q('#panel-status').textContent='卖出数量超过当前持仓，请核对历史或先校正。';return;}
 s.pendingFact={index,qty,price,type,mode,time,note};const next=mode==='只补记录'?h.qty:type==='买入'?h.qty+qty:type==='卖出'?h.qty-qty:qty;
 const entries=[['证券',h.name],['实际发生',time+' · '+type+' '+qty+' 股 × '+fmt(price)+' 元'],['持仓数量',h.qty+' → '+next+' 股'],['记录方式',mode],['原因',note]];
 openPanel('确认记录对持仓的影响',table(['项目','内容'],entries.map(row=>'<tr>'+td(esc(row[0]))+td(esc(row[1]))+'</tr>'))+button('确认保存到预览','commit-fact','primary')+button('取消','close-detail'));
}
root.addEventListener('submit',e=>{e.preventDefault();});
root.addEventListener('change',e=>{if(e.target.id==='preference'){s.pendingPreference=e.target.value;s.saved=false;render();persist();}});
window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);render();}});
render();
const options=[{label:'雾白与石墨',value:'graphite'},{label:'鼠尾草与松绿',value:'sage'},{label:'雾粉与莓紫',value:'rose'},{label:'浅柠与橄榄',value:'olive'},{label:'云蓝与墨蓝（原有）',value:'cloud'},{label:'薄荷与深海（原有）',value:'mint'}];
const design={palette:s.palette||'graphite'};
function applyPalette(){root.dataset.palette=design.palette;s.palette=design.palette;}
applyPalette();
q('.palette-preview').hidden=false;
q('#palette-choice').innerHTML=options.map(o=>`<option value="${o.value}">${o.label}</option>`).join('');
q('#palette-choice').value=design.palette;
q('#palette-choice').addEventListener('change',e=>{design.palette=e.target.value;applyPalette();persist();});

})();
</script>
